name: Umbraco Dashboard Demo

stages:
  - alias: main
    branch: main
    title: Starting point
    # No `open:` — first stage opens with just the file tree (default).

  - alias: shell
    branch: feature/dashboard-shell
    title: Add dashboard shell
    open:
      file: src/dashboard.ts
      id: registerDashboard

  - alias: preview
    branch: feature/dashboard-preview
    title: Preview dashboard
    reset: true
    open:
      file: src/dashboard.ts
      id: registerDashboard
    # Stage agenda — surfaced under the explorer as a clickable checklist.
    # Items tick once their file has been opened during this stage's tenure.
    cover:
      - src/dashboard.ts#registerDashboard
      - src/api.ts#fetchDashboardData
      - file: src/dashboard.ts
        id: renderCharts
        label: Chart helpers
    steps:
      - alias: intro
        title: Overview
      - alias: fetchImpl
        title: Fetching data
        open:
          file: src/api.ts
          id: fetchDashboardData
        preview:
          type: video
          src: ./videos/backoffice-demo.mp4
          autoLaunch: end
          startAt: 4.5
          stopAt: 32.0
          cues:
            - time: 12.0
            - time: 21.5
            - time: 28.0
      - alias: chartHelpers
        title: Chart helpers
        open:
          file: src/dashboard.ts
          id: renderCharts
        preview: ~

  - alias: demo
    branch: feature/recorded-demo
    title: Recorded backoffice walkthrough
    open:
      file: src/api.ts
      line: 1
    preview:
      type: video
      src: ./videos/backoffice-demo.mp4
      startAt: 4.5
      stopAt: 32.0
      cues:
        - time: 12.0
        - time: 21.5
        - time: 28.0
