name: Dashboard Demo

stages:
  - id: main
    branch: main
    title: Starting point
    # No `open:` — first stage opens with just the file tree (default).

  - id: shell
    branch: feature/dashboard-shell
    title: Add dashboard shell
    open: src/dashboard.ts#registerDashboard

  - id: preview
    branch: feature/dashboard-preview
    title: Preview dashboard
    reset: true
    # Stage entry opens an intro README from the private `.prezl/` folder.
    # The file is loaded and openable but never appears in the explorer.
    open: .prezl/intro.md
    # Stage agenda — surfaced under the explorer as a clickable checklist.
    # Items tick once their file has been opened during this stage's tenure.
    cover:
      - src/dashboard.ts#registerDashboard
      - src/api.ts#fetchDashboardData
      - file: src/dashboard.ts
        id: renderCharts
        title: Chart helpers
    steps:
      - id: intro
        title: Overview
      - id: fetchImpl
        title: Fetching data
        open: src/api.ts#fetchDashboardData
        demos:
          - title: demo1
            type: video
            src: ./videos/backoffice-demo.mp4
            autoLaunch: end
            startAt: 4.5
            stopAt: 32.0
            cues:
              - 12.0
              - 21.5
              - 28.0
          - title: demo2
            type: video
            src: ./videos/backoffice-demo.mp4
      - id: chartHelpers
        title: Chart helpers
        open: src/dashboard.ts#renderCharts

  - id: demo
    branch: feature/recorded-demo
    title: Recorded backoffice walkthrough
    open: src/api.ts@1
    demo:
      # Project-wide id — referenced from the preview stage's intro README
      # via `[Watch the walkthrough](demo://backoffice-walkthrough)`.
      id: backoffice-walkthrough
      type: video
      src: ./videos/backoffice-demo.mp4
      startAt: 4.5
      stopAt: 32.0
      cues:
        - 12.0
        - 21.5
        - { time: 28.0, title: "Discuss the modal flow" }
