name: Contoso Weather Demo

projects:
  - name: Backend
    path: src/Backend
    icon: dotnet
  - name: Frontend
    path: src/Frontend
    icon: typescript

stages:
  - id: main
    branch: main
    title: Starting point
    open: src/Backend/Program.cs

  - id: api
    branch: feature/weather-api
    title: Add Weather API
    open:
      file: src/Backend/Api/WeatherController.cs
      id: weatherController

  - id: ui
    branch: feature/weather-ui
    title: Wire the UI
    open:
      file: src/Frontend/components/Weather.tsx
      id: weatherComponent
