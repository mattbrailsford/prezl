name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0-beta.1). Must already exist.'
        required: true

permissions:
  contents: write

# Match docs.yml: opt JS-based actions into Node 24 ahead of GitHub's
# Node 20 deprecation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-24.04
            args: ''
          # Skip the MSI bundle: Windows Installer's version field can't
          # carry semver pre-release identifiers like "-beta.1" (requires
          # numeric-only, ≤65535). NSIS handles them fine and is what most
          # end users actually want anyway.
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri 2's canonical Linux dependency set. patchelf is bundled by
      # tauri-cli now; libayatana-appindicator3-dev replaces the legacy
      # libappindicator3-dev. Mixing the two used to fail apt resolution.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # Read RELEASE_NOTES.md if the bump commit included it; fall back to
      # a generic placeholder otherwise. shell:bash works on all three
      # runners — Windows has Git Bash on PATH.
      - name: Prepare release body
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              cat <<'FALLBACK'
          See the assets below to download and install.

          > Builds are currently unsigned — Windows SmartScreen and macOS
          > Gatekeeper will warn on first launch.
          FALLBACK
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Prezl ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

      # Ship a portable Windows build alongside the NSIS installer: a single
      # renamed copy of the unbundled exe. Prezl detects "portable" in its
      # own filename at runtime and stores config in an exe-adjacent data/
      # folder, so dropping this one file anywhere — USB stick, conference
      # laptop — is enough.
      - name: Stage Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $portableExe = "Prezl_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/prezl.exe $portableExe
          "PORTABLE_EXE=$portableExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach portable exe to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG $env:PORTABLE_EXE --clobber
